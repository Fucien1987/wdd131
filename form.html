<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Kerlando Fucien">
    <meta name="description" content="WDD 131 Product Review Form">

    <title>Product Review</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/form.js" defer></script>
</head>
<body>

<header>
    <h1>Product Review</h1>
</header>

<main>
    <form method="get" action="review.html">
        <label for="product">Product Name</label>

        <select id="product" name="product" required>
            <option value="" disabled selected>Select a Produit...</option>
        </select>
        <label>Overall Rating</label>

        <div class="rating">
            <label>
                &#9734;
                <input type="radio" name="rating" id="star1" value="1" required>
            </label>
            <label>
                &#9734;&#9734;
                <input type="radio" name="rating" id="star2" value="2">
            </label>
            <label>
                &#9734;&#9734;&#9734;
                <input type="radio" name="rating" id="star3" value="3">
            </label>
            <label>
                &#9734;&#9734;&#9734;&#9734;
                <input type="radio" name="rating" id="star4" value="4">
            </label>
            <label>
                &#9734;&#9734;&#9734;&#9734;&#9734;
                <input type="radio" name="rating" id="star5" value="5">
            </label>
        </div>
        <label for="installDate">Date of Installation</label>
        <input
            type="date"
            id="installDate"
            name="installDate"
            required>
        <fieldset>
          <legend>
            Which features did you find useful in the product?<br>
            <em>(Check all that apply)</em>
          </legend>

          <label>
            <input type="checkbox" id="durability" name="features" value="Durability">
            Durability
          </label>

          <label>
            <input type="checkbox" id="ease" name="features" value="Ease of Use">
            Ease of Use
          </label>

          <label>
            <input type="checkbox" id="performance" name="features" value="Performance">
            Performance
          </label>

          <label>
            <input type="checkbox" id="design" name="features" value="Design">
            Design
         </label>
        </fieldset>
        
        <label for="review">
            Written Review <span class="optional">(Optional)</span>
        </label>
        
        <textarea
            id="review"
            Name="review"
            rows="5"
            cols="30">
        </textarea>
        <label for="username">
            Your Name <span class="optional">(Optional)</span>
        </label>

        <input
            type="text"
            id="username"
            name="username">
        <input 
            type="submit"
            value="Post Review">
    </form>
</main>

<footer>
    <p>&copy; <span id="currentyear"></span> Kerlando Fucien - Massachusets, USA</p>
    <p id="lastModified"></p>
</footer>
</body>
</html>
