<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Kerlando Fucien">
    <meta name="description" content="Submit a product review by selecting a product, rating it, choosing useful features,and providing optional comments.">

    <title>Product Review</title>

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/getdates.js" defer></script>
    <script src="scripts/form.js" defer></script>
</head>
<body>

<header>
    <h1>Product Review</h1>
</header>

<main>
    <form method="get" action="review.html">
        <label for="product">Product Name</label>

        <select id="product" name="product" required>
            <option value="" disabled selected>Select a Product...</option>
        </select>
        <label>Overall Rating</label>

        <div class="rating">
            <label for="star1">
                &#9734;
                <input type="radio" id="star1" name="rating"  value="1" required>
            </label>

            <label for="star2">
                &#9734;&#9734;
                <input type="radio" id="star2" name="rating"  value="2" required>
            </label>

            <label for="star3">
                &#9734;&#9734;&#9734;
                <input type="radio" id="star3" name="rating"  value="3" required>
            </label>
        
            <label for="star4">
                &#9734;&#9734;&#9734;&#9734;
                <input type="radio" id="star4" name="rating"  value="4" required>
            </label>
             
            <label> for="start5">
                &#9734;&#9734;&#9734;&#9734;&#9734;
                <input type="radio" id="star5" name="rating"  value="5" required>
            </label>
            
        </div>
        <label for="installDate">Date of Installation</label>
        <input
            type="date"
            id="installDate"
            name="installDate"
            required>
        <fieldset>
          <legend>
            Which features did you find useful in the product?<br>
            <em>(Check all that apply)</em>
          </legend>
          <label for="durability">
            <input type="checkbox" id="durability" name="features" value="Durability">
            Durability
          </label>

          <label for="ease">
            <input type="checkbox" id="ease" name="features" value="Ease of Use">
            Ease of Use
          </label>

          <label for="performance">
            <input type="checkbox" id="performance" name="features" value="Performance">
            Performance
          </label>

          <label for="design">
            <input type="checkbox" id="design" name="features" value="Design">
            Design
          </label>
        </fieldset>
        
        <label for="review">
            Written Review <span class="optional">(Optional)</span>
        </label>
        
        <textarea
            id="review"
            Name="review"
            rows="5"
            cols="30">
        </textarea>
        <label for="username">
            Your Name <span class="optional">(Optional)</span>
        </label>

        <input
            type="text"
            id="username"
            name="username">
        <input 
            type="submit"
            value="Post Review">
    </form>
</main>

<footer>
    <p>&copy; <span id="currentyear"></span>
        Kerlando Fucien - Massachusets, USA
    </p>
    <p id="lastModified"></p>
</footer>
</body>
</html>
